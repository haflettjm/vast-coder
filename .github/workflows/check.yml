name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go proxy (format, vet, tests with the race detector)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Lifecycle safety checks (no cloud credentials)
        run: python3 test_lifecycle.py
      - name: Endpoint cache and discovery checks
        run: python3 test_endpoint.py
      - name: Watchdog checks
        run: python3 -m unittest -v test_health
      - name: Shell syntax
        shell: bash
        run: |
          for script in bin/*; do
            [[ -f "$script" ]] || continue
            IFS= read -r first < "$script"
            if [[ "$first" == *bash* ]]; then
              bash -n "$script"
            elif [[ "$first" == *python* ]]; then
              python3 -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text())' "$script"
            fi
          done
